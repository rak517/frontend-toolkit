name: Bundle Size Check

on:
  pull_request:
    branches: [main]

jobs:
  size-check:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies (base)
        run: pnpm install --frozen-lockfile

      - name: Build (base)
        run: pnpm build

      - name: Measure size (base)
        run: |
          echo "## Base Branch (main) Sizes" > /tmp/base-sizes.txt
          for pkg in packages/hooks packages/components packages/utils; do
            if [ -d "$pkg/dist" ]; then
              echo "- $pkg: $(du -sh $pkg/dist | cut -f1)" >> /tmp/base-sizes.txt
            fi
          done

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Clean previous build
        run: rm -rf packages/*/dist apps/*/dist

      - name: Install dependencies (PR)
        run: pnpm install --frozen-lockfile

      - name: Build (PR)
        run: pnpm build

      - name: Measure size (PR)
        run: |
          echo "## PR Branch Sizes" > /tmp/pr-sizes.txt
          for pkg in packages/hooks packages/components packages/utils; do
            if [ -d "$pkg/dist" ]; then
              echo "- $pkg: $(du -sh $pkg/dist | cut -f1)" >> /tmp/pr-sizes.txt
            fi
          done

      - name: Comment comparison
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const baseSizes = fs.readFileSync('/tmp/base-sizes.txt', 'utf8');
            const prSizes = fs.readFileSync('/tmp/pr-sizes.txt', 'utf8');

            const body = `## 📦 Bundle Size Comparison\n\n${baseSizes}\n\n${prSizes}\n\n---\n*Sizes measured with \`du -sh\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Bundle Size Comparison')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
